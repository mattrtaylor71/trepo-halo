      Environment:
        Variables:
          DB_HOST:  !Ref DBHost
          DB_PORT:  !Ref DBPort
          DB_USER:  !Ref DBUser
          DB_PASS:  !Ref DBPass
          DB_NAME:  !Ref DBName
      Policies:
