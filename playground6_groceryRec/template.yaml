        PatchDiscardRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /discards/{owner}/{item_id}
            Method: PATCH
        DeleteDiscardRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /discards/{owner}/{item_id}
            Method: DELETE
        OptionsDiscardsRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /discards/{owner}
            Method: OPTIONS
        OptionsDiscardItemRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /discards/{owner}/{item_id}
            Method: OPTIONS
      VpcConfig: !If
        - UseVpcCond
        - { SecurityGroupIds: [ !Ref LambdaSecurityGroupId ], SubnetIds: !Ref LambdaSubnetIds }
        - !Ref AWS::NoValue

  MetricsApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: metrics_api/
      Handler: app.handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          DB_HOST:  !Ref DBHost
          DB_PORT:  !Ref DBPort
          DB_USER:  !Ref DBUser
          DB_PASS:  !Ref DBPass
          DB_NAME:  !Ref DBName
      Policies:
        - !If
          - UseVpcCond
