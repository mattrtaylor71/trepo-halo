AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Trepo Grocery Logger - presign -> upload -> analyze (DDB + Rekognition + MySQL)

Parameters:
  Env:
    Type: String
    Default: dev
  UploadsBucketName:
    Type: String
    Description: Existing S3 bucket for uploads
  DiscardsBucketName:
    Type: String
    Description: Existing S3 bucket for discard uploads
    Default: trepo-grocery-discards-dev
  CreateResultsTable:
    Type: String
    Default: 'true'
  IotDataEndpoint:
    Type: String
    Description: "IoT Data endpoint, e.g. abcd123-ats.iot.us-east-1.amazonaws.com"

  # --- OpenAI ---
  OpenAIApiKey:
    Type: String
    NoEcho: true
    Description: "OpenAI API key for vision recognition"

  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: "Stripe webhook signing secret (optional)"

  StripeSecretKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: "Stripe secret key for promo code creation"

  # --- RDS (MySQL) ---
  DBHost:
    Type: String
    Default: database-1.cvig8u6s25dz.us-east-1.rds.amazonaws.com
  DBPort:
    Type: Number
    Default: 3306
  DBUser:
    Type: String
    Default: admin
  DBPass:
    Type: String
    NoEcho: true
    Default: Nbmqyq17!
  DBName:
    Type: String
    Default: mysqlTutorial
  DBTable:
    Type: String
    Default: grocery_events

  # --- Optional VPC for Lambda ↔ RDS ---
  UseVpc:
    Type: String
    AllowedValues: ['true','false']
    Default: 'false'
  LambdaSecurityGroupId:
    Type: String
    Default: ''
  LambdaSubnetIds:
    Type: CommaDelimitedList
    Default: ''

Conditions:
  HasResults: !Equals [ !Ref CreateResultsTable, 'true' ]
  UseVpcCond: !Equals [ !Ref UseVpc, 'true' ]

Globals:
  Function:
    Runtime: python3.9
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        BUCKET_NAME: !Ref UploadsBucketName
        JOBS_TABLE: !Ref JobsTable
        RESULTS_TABLE: !If [HasResults, !Ref ResultsTable, !Ref AWS::NoValue]
        KEY_PREFIX: images/
        PRESIGN_TTL_SECONDS: 300
        IOT_ENDPOINT: !Ref IotDataEndpoint
        RESULT_TOPIC_TEMPLATE: "trepo/{user_id}/{device_id}/jobs/{job_id}/result"
        DB_HOST:  !Ref DBHost
        DB_PORT:  !Ref DBPort
        DB_USER:  !Ref DBUser
        DB_PASS:  !Ref DBPass
        DB_NAME:  !Ref DBName
        DB_TABLE: !Ref DBTable
        OPENAI_API_KEY: !Ref OpenAIApiKey

Resources:

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: ['*']
        AllowHeaders: ['content-type','authorization']

  PresignFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: presign/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - Statement:
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/images/*"
        - Statement:
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::${DiscardsBucketName}/images/*"
        - !If
          - UseVpcCond
          - AWSLambdaVPCAccessExecutionRole
          - !Ref AWS::NoValue
      Environment:
        Variables:
          DISCARDS_BUCKET_NAME: !Ref DiscardsBucketName
      Events:
        PresignRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /presign
            Method: POST
        PresignDiscardRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /presign/discard
            Method: POST
      VpcConfig: !If
        - UseVpcCond
        - { SecurityGroupIds: [ !Ref LambdaSecurityGroupId ], SubnetIds: !Ref LambdaSubnetIds }
        - !Ref AWS::NoValue

  AnalyzeOnUpload:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: analyze_on_upload_nodejs/
      Handler: app.handler
      Runtime: nodejs20.x
      Timeout: 300
      MemorySize: 2048
      Environment:
        Variables:
          BUCKET_NAME: !Ref UploadsBucketName
          JOBS_TABLE: !Ref JobsTable
          KEY_PREFIX: images/
          IOT_ENDPOINT: !Ref IotDataEndpoint
          RESULT_TOPIC_TEMPLATE: "trepo/{user_id}/{device_id}/jobs/{job_id}/result"
          DB_HOST:  !Ref DBHost
          DB_PORT:  !Ref DBPort
          DB_USER:  !Ref DBUser
          DB_PASS:  !Ref DBPass
          DB_NAME:  !Ref DBName
          OPENAI_API_KEY: !Ref OpenAIApiKey
          OPENAI_MODEL: "gpt-5.4-2026-03-05"
          OPENAI_IMAGE_VERIFY_MODEL: "gpt-5.4-2026-03-05"
          EXPIRATION_MODEL: "gpt-5.4-2026-03-05"
          FAST_DISH_MODEL: "gpt-5.4-2026-03-05"
          FAST_DISH_MAX_TOKENS: "120"
          FAST_DISH_TEMPERATURE: "0.0"
          FAST_DISH_IMAGE_DETAIL: "low"
          FULL_DISH_MODEL: "gpt-5.4-2026-03-05"
          FULL_DISH_MAX_TOKENS: "2000"
          FULL_DISH_TEMPERATURE: "0.3"
          FULL_DISH_IMAGE_DETAIL: "high"
          MEAL_PLAN_GENERATOR_ARN: !Ref MealPlanGeneratorFunction
          RECIPES_GENERATOR_ARN: !Ref RecipesGeneratorFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - !If
          - HasResults
          - { DynamoDBCrudPolicy: { TableName: !Ref ResultsTable } }
          - !Ref AWS::NoValue
        - Statement:
            Effect: Allow
            Action: iot:Publish
            Resource: "*"
        - Statement:
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/images/*"
        - Statement:
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/product-images/*"
        - Statement:
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt MealPlanGeneratorFunction.Arn
        - Statement:
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt RecipesGeneratorFunction.Arn
        - !If
          - UseVpcCond
          - AWSLambdaVPCAccessExecutionRole
          - !Ref AWS::NoValue
      Events:
        S3CreateViaEB:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [aws.s3]
              detail-type: ["Object Created"]
              detail:
                bucket:
                  name: [!Ref UploadsBucketName]
                object:
                  key:
                    - prefix: images/
      VpcConfig: !If
        - UseVpcCond
        - { SecurityGroupIds: [ !Ref LambdaSecurityGroupId ], SubnetIds: !Ref LambdaSubnetIds }
        - !Ref AWS::NoValue

