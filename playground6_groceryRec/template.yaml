  AnalyzeDiscardOnUpload:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: analyze_discard_on_upload_nodejs/
      Handler: app.handler
      Runtime: nodejs20.x
      Timeout: 300
      MemorySize: 2048
      Environment:
        Variables:
          BUCKET_NAME: !Ref DiscardsBucketName
          PRODUCT_IMAGES_BUCKET: !Ref UploadsBucketName
          JOBS_TABLE: !Ref JobsTable
          KEY_PREFIX: images/
          IOT_ENDPOINT: !Ref IotDataEndpoint
          RESULT_TOPIC_TEMPLATE: "trepo/{user_id}/{device_id}/jobs/{job_id}/result"
          DB_HOST:  !Ref DBHost
          DB_PORT:  !Ref DBPort
          DB_USER:  !Ref DBUser
          DB_PASS:  !Ref DBPass
          DB_NAME:  !Ref DBName
          OPENAI_API_KEY: !Ref OpenAIApiKey
          OPENAI_MODEL: "gpt-5.4-2026-03-05"
          OPENAI_IMAGE_VERIFY_MODEL: "gpt-5.4-2026-03-05"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - !If
          - HasResults
          - { DynamoDBCrudPolicy: { TableName: !Ref ResultsTable } }
          - !Ref AWS::NoValue
        - Statement:
            Effect: Allow
            Action: iot:Publish
            Resource: "*"
        - Statement:
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${DiscardsBucketName}/images/*"
        - Statement:
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::${DiscardsBucketName}/discard-images/*"
        - Statement:
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/discard-images/*"
        - !If
          - UseVpcCond
          - AWSLambdaVPCAccessExecutionRole
          - !Ref AWS::NoValue
      Events:
        S3CreateViaEB:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [aws.s3]
              detail-type: ["Object Created"]
              detail:
                bucket:
                  name: [!Ref DiscardsBucketName]
                object:
                  key:
                    - prefix: images/
      VpcConfig: !If
        - UseVpcCond
        - { SecurityGroupIds: [ !Ref LambdaSecurityGroupId ], SubnetIds: !Ref LambdaSubnetIds }
        - !Ref AWS::NoValue

  GetJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get_job/
      Handler: app.handler
      Environment:
        Variables:
          BUCKET_NAME: !Ref UploadsBucketName
          JOBS_TABLE: !Ref JobsTable
          PRESIGN_TTL_SECONDS: 3600
          DB_HOST:  !Ref DBHost
          DB_PORT:  !Ref DBPort
          DB_USER:  !Ref DBUser
          DB_PASS:  !Ref DBPass
          DB_NAME:  !Ref DBName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref JobsTable
        - Statement:
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/*"
        - !If
          - UseVpcCond
          - AWSLambdaVPCAccessExecutionRole
          - !Ref AWS::NoValue
      Events:
        GetJobRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /job/{job_id}
            Method: GET
      VpcConfig: !If
        - UseVpcCond
        - { SecurityGroupIds: [ !Ref LambdaSecurityGroupId ], SubnetIds: !Ref LambdaSubnetIds }
