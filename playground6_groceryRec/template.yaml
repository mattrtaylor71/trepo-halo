            Method: GET
        GetDishByIdRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /dishes/{owner}/{item_id}
            Method: GET
        UpdateDishRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /dishes/{owner}/{item_id}
            Method: PUT
        PatchDishRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /dishes/{owner}/{item_id}
            Method: PATCH
        DeleteDishRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /dishes/{owner}/{item_id}
            Method: DELETE
        OptionsDishesRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /dishes/{owner}
            Method: OPTIONS
        OptionsDishItemRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /dishes/{owner}/{item_id}
            Method: OPTIONS
      VpcConfig: !If
        - UseVpcCond
        - { SecurityGroupIds: [ !Ref LambdaSecurityGroupId ], SubnetIds: !Ref LambdaSubnetIds }
        - !Ref AWS::NoValue

  # Bucket policy to make product-images and dish-images publicly readable
  ProductImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadsBucketName
      PolicyDocument:
        Statement:
          - Sid: PublicReadProductImages
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/product-images/*"
          - Sid: PublicReadDishImages
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/dish-images/*"
          - Sid: PublicReadDiscardImages
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/discard-images/*"
          - Sid: PublicReadMealPlanImages
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/meal-plan-images/*"
          - Sid: PublicReadRecipeImages
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/recipe-images/*"


  DiscardsApiFunction:
