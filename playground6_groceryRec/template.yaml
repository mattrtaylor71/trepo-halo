  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "TrepoJobs-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: job_id, AttributeType: S }
      KeySchema:
        - { AttributeName: job_id, KeyType: HASH }

  ResultsTable:
    Condition: HasResults
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "TrepoResults-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: job_id, AttributeType: S }
      KeySchema:
        - { AttributeName: job_id, KeyType: HASH }

  OtaSchedulesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "TrepoOtaSchedules-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: device_id, AttributeType: S }
        - { AttributeName: request_id, AttributeType: S }
      KeySchema:
        - { AttributeName: device_id, KeyType: HASH }
        - { AttributeName: request_id, KeyType: RANGE }

  OtaReportEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "TrepoOtaReportEvents-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: device_id, AttributeType: S }
        - { AttributeName: event_ts_key, AttributeType: S }
        - { AttributeName: request_id, AttributeType: S }
        - { AttributeName: ts_epoch, AttributeType: N }
        - { AttributeName: report_type, AttributeType: S }
      KeySchema:
        - { AttributeName: device_id, KeyType: HASH }
        - { AttributeName: event_ts_key, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: RequestIdTsIndex
          KeySchema:
            - { AttributeName: request_id, KeyType: HASH }
            - { AttributeName: ts_epoch, KeyType: RANGE }
          Projection:
            ProjectionType: ALL
        - IndexName: ReportTypeTsIndex
          KeySchema:
            - { AttributeName: report_type, KeyType: HASH }
            - { AttributeName: ts_epoch, KeyType: RANGE }
          Projection:
            ProjectionType: ALL

  OtaDeviceLatestTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "TrepoOtaDeviceLatest-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: device_id, AttributeType: S }
        - { AttributeName: owner_id, AttributeType: S }
        - { AttributeName: last_seen_epoch, AttributeType: N }
      KeySchema:
        - { AttributeName: device_id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: OwnerLatestIndex
          KeySchema:
            - { AttributeName: owner_id, KeyType: HASH }
            - { AttributeName: last_seen_epoch, KeyType: RANGE }
          Projection:
            ProjectionType: ALL

Outputs:
  ApiUrl:
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"
  BucketName:
    Value: !Ref UploadsBucketName
  JobsTableName:
    Value: !Ref JobsTable
  ResultsTableName:
    Condition: HasResults
    Value: !Ref ResultsTable
  OtaSchedulesTableName:
    Value: !Ref OtaSchedulesTable
  OtaReportEventsTableName:
    Value: !Ref OtaReportEventsTable
  OtaDeviceLatestTableName:
    Value: !Ref OtaDeviceLatestTable
