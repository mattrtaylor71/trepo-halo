  DishResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dish_result/
      Handler: app.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref JobsTable
        - !If
          - HasResults
          - { DynamoDBReadPolicy: { TableName: !Ref ResultsTable } }
          - !Ref AWS::NoValue
      Events:
        DishResultRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /dish/result
            Method: GET

  OtaScheduleApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ota_schedule_api/
      Handler: app.handler
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          OTA_SCHEDULES_TABLE: !Ref OtaSchedulesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OtaSchedulesTable
      Events:
        GetOtaScheduleRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ota/schedule
            Method: GET

  OtaScheduleAdminApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ota_schedule_admin_api/
      Handler: app.handler
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          OTA_SCHEDULES_TABLE: !Ref OtaSchedulesTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OtaSchedulesTable
      Events:
        GetOtaAdminScheduleRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ota/admin/schedule
            Method: GET
        PostOtaAdminScheduleRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ota/admin/schedule
            Method: POST
        PostOtaAdminScheduleClearRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ota/admin/schedule/clear
            Method: POST

  OtaReportApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ota_report_api/
      Handler: app.handler
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          OTA_REPORT_EVENTS_TABLE: !Ref OtaReportEventsTable
          OTA_DEVICE_LATEST_TABLE: !Ref OtaDeviceLatestTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OtaReportEventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OtaDeviceLatestTable
      Events:
        PostOtaReportRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ota/report
            Method: POST
        GetOtaReportLatestRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ota/report/latest
            Method: GET
        GetOtaReportEventsRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ota/report/events
            Method: GET

  KitchenApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: kitchen_api/
      Handler: app.handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          DB_HOST:  !Ref DBHost
          DB_PORT:  !Ref DBPort
          DB_USER:  !Ref DBUser
          DB_PASS:  !Ref DBPass
          DB_NAME:  !Ref DBName
          MEAL_PLAN_GENERATOR_ARN: !Ref MealPlanGeneratorFunction
          RECIPES_GENERATOR_ARN: !Ref RecipesGeneratorFunction
      Policies:
        - !If
          - UseVpcCond
          - AWSLambdaVPCAccessExecutionRole
          - !Ref AWS::NoValue
        - Statement:
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt MealPlanGeneratorFunction.Arn
        - Statement:
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt RecipesGeneratorFunction.Arn
      Events:
        GetKitchenRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /kitchen/{owner}
            Method: GET
        UpdateKitchenItemRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /kitchen/{owner}/{item_id}
            Method: PUT
        PatchKitchenItemRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /kitchen/{owner}/{item_id}
            Method: PATCH
        DeleteKitchenItemRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /kitchen/{owner}/{item_id}
            Method: DELETE
        OptionsKitchenRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /kitchen/{owner}
            Method: OPTIONS
        OptionsKitchenItemRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /kitchen/{owner}/{item_id}
            Method: OPTIONS
      VpcConfig: !If
        - UseVpcCond
        - { SecurityGroupIds: [ !Ref LambdaSecurityGroupId ], SubnetIds: !Ref LambdaSubnetIds }
        - !Ref AWS::NoValue

  DishesApiFunction:
