AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Trepo Grocery Logger - presign -> upload -> analyze (DDB + Rekognition + MySQL)

Parameters:
  Env:
    Type: String
    Default: dev
  UploadsBucketName:
    Type: String
    Description: Existing S3 bucket for uploads
  DiscardsBucketName:
    Type: String
    Description: Existing S3 bucket for discard uploads
    Default: trepo-grocery-discards-dev
  CreateResultsTable:
    Type: String
    Default: 'true'
  IotDataEndpoint:
    Type: String
    Description: "IoT Data endpoint, e.g. abcd123-ats.iot.us-east-1.amazonaws.com"

  # SEC-001 Phase B: HMAC secret used to verify signed auth tokens (observe mode)
  TokenSigningSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: "HMAC-SHA256 signing secret shared with the auth Lambda for token verification"

  # --- OpenAI ---
  OpenAIApiKey:
    Type: String
    NoEcho: true
    Description: "OpenAI API key for vision recognition"
  EnableLlmInventoryMatching:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: "Enable inline LLM inventory matching for recipe personalization"
  OpenAIInventoryModel:
    Type: String
    Default: gpt-4.1-mini
    Description: "OpenAI model used for LLM inventory matching"
  SerpApiKey:
    Type: String
    NoEcho: true
    Description: "SerpAPI key for product/store/image search"
  YtdlpCookieFileB64:
    Type: String
    NoEcho: true
    Default: ''
    Description: "Optional base64-encoded Netscape cookies.txt contents for authenticated yt-dlp access"
  ApifyToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: "Optional Apify token for Instagram extraction fallback"

  ScrapeCreatorsApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: "ScrapeCreators API key for TikTok photo/slideshow extraction"

  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: "Stripe webhook signing secret (optional)"

  StripeSecretKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: "Stripe secret key for promo code creation"

  # --- RDS (MySQL) ---
  DBHost:
    Type: String
    Description: "RDS hostname (provide via samconfig.toml or CLI)"
  DBPort:
    Type: Number
    Default: 3306
  DBUser:
    Type: String
    Description: "RDS username (provide via samconfig.toml or CLI)"
  DBPass:
    Type: String
    NoEcho: true
    Description: "RDS password (provide via samconfig.toml or CLI)"
  DBName:
    Type: String
    Description: "RDS database name (provide via samconfig.toml or CLI)"
  DBTable:
    Type: String
    Default: grocery_events
  AnalyzeOnUploadReservedConcurrency:
    Type: Number
    Default: 60
  AnalyzeDishReservedConcurrency:
    Type: Number
    Default: 40
  AnalyzeDiscardReservedConcurrency:
    Type: Number
    Default: 40
  MealPlanGeneratorReservedConcurrency:
    Type: Number
    Default: 20
  RecipesGeneratorReservedConcurrency:
    Type: Number
    Default: 30
  # API handler concurrency limits (prevent RDS connection exhaustion)
  ApiHandlerReservedConcurrency:
    Type: Number
    Default: 30
  LightApiReservedConcurrency:
    Type: Number
    Default: 20

  # --- Optional VPC for Lambda ↔ RDS ---
  UseVpc:
    Type: String
    AllowedValues: ['true','false']
    Default: 'false'
  LambdaSecurityGroupId:
    Type: String
    Default: ''
  LambdaSubnetIds:
    Type: CommaDelimitedList
    Default: ''

Conditions:
  HasResults: !Equals [ !Ref CreateResultsTable, 'true' ]
  UseVpcCond: !Equals [ !Ref UseVpc, 'true' ]

Globals:
  Function:
    Runtime: python3.9
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        BUCKET_NAME: !Ref UploadsBucketName
        JOBS_TABLE: !Ref JobsTable
        RESULTS_TABLE: !If [HasResults, !Ref ResultsTable, !Ref AWS::NoValue]
        KEY_PREFIX: images/
        PRESIGN_TTL_SECONDS: 300
        IOT_ENDPOINT: !Ref IotDataEndpoint
        RESULT_TOPIC_TEMPLATE: "trepo/{user_id}/{device_id}/jobs/{job_id}/result"
        DB_HOST:  !Ref DBHost
        DB_PORT:  !Ref DBPort
        DB_USER:  !Ref DBUser
        DB_PASS:  !Ref DBPass
        DB_NAME:  !Ref DBName
        DB_TABLE: !Ref DBTable
        OPENAI_API_KEY: !Ref OpenAIApiKey
        DB_CONNECT_TIMEOUT_SECONDS: 5
        # SEC-001 Phase B: shared token verification + owner authorization (observe mode)
        TOKEN_SIGNING_SECRET: !Ref TokenSigningSecret
        ENFORCE_AUTH: 'false'
        DB_READ_TIMEOUT_SECONDS: 30
        DB_WRITE_TIMEOUT_SECONDS: 30
        DB_CONNECT_TIMEOUT_MS: 5000
        USE_SHARED_TABLES: 'true'
        WRITE_SHARED_ONLY: 'true'

Resources:

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: ['*']
        AllowHeaders: ['content-type','authorization']

  PresignFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: presign/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - Statement:
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/images/*"
        - Statement:
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::${DiscardsBucketName}/images/*"
        - Statement:
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/recipe-images/*"
        - !If
          - UseVpcCond
          - AWSLambdaVPCAccessExecutionRole
          - !Ref AWS::NoValue
      Environment:
        Variables:
          DISCARDS_BUCKET_NAME: !Ref DiscardsBucketName
      Events:
        PresignRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /presign
            Method: POST
        PresignDiscardRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /presign/discard
            Method: POST
        SavedRecipesPresignRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /saved-recipes/presign
            Method: POST
      VpcConfig: !If
        - UseVpcCond
        - { SecurityGroupIds: [ !Ref LambdaSecurityGroupId ], SubnetIds: !Ref LambdaSubnetIds }
        - !Ref AWS::NoValue

  AnalyzeOnUpload:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: analyze_on_upload_nodejs/
      Handler: app.handler
      Runtime: nodejs20.x
      Timeout: 300
      MemorySize: 2048
      ReservedConcurrentExecutions: !Ref AnalyzeOnUploadReservedConcurrency
      Environment:
        Variables:
          BUCKET_NAME: !Ref UploadsBucketName
          JOBS_TABLE: !Ref JobsTable
          KEY_PREFIX: images/
          IOT_ENDPOINT: !Ref IotDataEndpoint
          RESULT_TOPIC_TEMPLATE: "trepo/{user_id}/{device_id}/jobs/{job_id}/result"
          DB_HOST:  !Ref DBHost
          DB_PORT:  !Ref DBPort
          DB_USER:  !Ref DBUser
          DB_PASS:  !Ref DBPass
          DB_NAME:  !Ref DBName
          OPENAI_API_KEY: !Ref OpenAIApiKey
          SERPAPI_API_KEY: !Ref SerpApiKey
          OPENAI_FAST_MODEL: "gpt-4.1-mini"
          OPENAI_MODEL: "gpt-5.4-2026-03-05"
          OPENAI_IMAGE_VERIFY_MODEL: "gpt-5.4-2026-03-05"
          EXPIRATION_MODEL: "gpt-4.1-mini"
          FAST_DISH_MODEL: "gpt-5.4-2026-03-05"
          FAST_DISH_MAX_TOKENS: "120"
          FAST_DISH_TEMPERATURE: "0.0"
          FAST_DISH_IMAGE_DETAIL: "low"
          FULL_DISH_MODEL: "gpt-5.4-2026-03-05"
          FULL_DISH_MAX_TOKENS: "2000"
          FULL_DISH_TEMPERATURE: "0.3"
          FULL_DISH_IMAGE_DETAIL: "high"
          MEAL_PLAN_GENERATOR_ARN: !Ref MealPlanGeneratorFunction
          RECIPES_GENERATOR_ARN: !Ref RecipesGeneratorFunction
          KITCHEN_ANALYSIS_GENERATOR_ARN: !Ref KitchenAnalysisGeneratorFunction
          HOME_SUGGESTIONS_ARN: !Ref HomeSuggestionsFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - !If
          - HasResults
          - { DynamoDBCrudPolicy: { TableName: !Ref ResultsTable } }
          - !Ref AWS::NoValue
        - Statement:
            Effect: Allow
            Action: iot:Publish
            Resource: "*"
        - Statement:
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/images/*"
        - Statement:
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/resized-images/*"
        - Statement:
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/product-images/*"
        - Statement:
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt MealPlanGeneratorFunction.Arn
        - Statement:
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt RecipesGeneratorFunction.Arn
        - Statement:
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt KitchenAnalysisGeneratorFunction.Arn
        - Statement:
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt HomeSuggestionsFunction.Arn
        - !If
          - UseVpcCond
          - AWSLambdaVPCAccessExecutionRole
          - !Ref AWS::NoValue
      Events:
        S3CreateViaEB:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [aws.s3]
              detail-type: ["Object Created"]
              detail:
                bucket:
                  name: [!Ref UploadsBucketName]
                object:
                  key:
                    - prefix: images/
      VpcConfig: !If
        - UseVpcCond
        - { SecurityGroupIds: [ !Ref LambdaSecurityGroupId ], SubnetIds: !Ref LambdaSubnetIds }
        - !Ref AWS::NoValue

  AnalyzeDishOnUpload:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: analyze_dish_on_upload_nodejs/
      Handler: app.handler
      Runtime: nodejs20.x
      Timeout: 300
      MemorySize: 2048
      ReservedConcurrentExecutions: !Ref AnalyzeDishReservedConcurrency
      Environment:
        Variables:
          BUCKET_NAME: !Ref UploadsBucketName
          JOBS_TABLE: !Ref JobsTable
          KEY_PREFIX: images/
          IOT_ENDPOINT: !Ref IotDataEndpoint
          RESULT_TOPIC_TEMPLATE: "trepo/{user_id}/{device_id}/jobs/{job_id}/result"
          DB_HOST:  !Ref DBHost
          DB_PORT:  !Ref DBPort
          DB_USER:  !Ref DBUser
          DB_PASS:  !Ref DBPass
          DB_NAME:  !Ref DBName
          OPENAI_API_KEY: !Ref OpenAIApiKey
          OPENAI_MODEL: "gpt-5.4-2026-03-05"
          FAST_DISH_MODEL: "gpt-5.4-2026-03-05"
          FULL_DISH_MODEL: "gpt-5.4-2026-03-05"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - !If
          - HasResults
          - { DynamoDBCrudPolicy: { TableName: !Ref ResultsTable } }
          - !Ref AWS::NoValue
        - Statement:
            Effect: Allow
            Action: iot:Publish
            Resource: "*"
        - Statement:
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/images/*"
        - Statement:
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/resized-images/*"
        - Statement:
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/dish-images/*"
        - !If
          - UseVpcCond
          - AWSLambdaVPCAccessExecutionRole
          - !Ref AWS::NoValue
      Events:
        S3CreateViaEB:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [aws.s3]
              detail-type: ["Object Created"]
              detail:
                bucket:
                  name: [!Ref UploadsBucketName]
                object:
                  key:
                    - prefix: images/
      VpcConfig: !If
        - UseVpcCond
        - { SecurityGroupIds: [ !Ref LambdaSecurityGroupId ], SubnetIds: !Ref LambdaSubnetIds }
        - !Ref AWS::NoValue

  RecharacterizeDishFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: analyze_dish_on_upload_nodejs/
      Handler: recharacterize.handler
      Runtime: nodejs20.x
      Timeout: 120
      MemorySize: 1024
      ReservedConcurrentExecutions: !Ref LightApiReservedConcurrency
      Environment:
        Variables:
          BUCKET_NAME: !Ref UploadsBucketName
          DB_HOST:  !Ref DBHost
          DB_PORT:  !Ref DBPort
          DB_USER:  !Ref DBUser
          DB_PASS:  !Ref DBPass
          DB_NAME:  !Ref DBName
          OPENAI_API_KEY: !Ref OpenAIApiKey
          OPENAI_MODEL: "gpt-5.4-2026-03-05"
          FAST_DISH_MODEL: "gpt-5.4-2026-03-05"
          FULL_DISH_MODEL: "gpt-5.4-2026-03-05"
      Policies:
        - Statement:
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/images/*"
        - Statement:
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/dish-images/*"
        - !If
          - UseVpcCond
          - AWSLambdaVPCAccessExecutionRole
          - !Ref AWS::NoValue
      Events:
        RecharacterizeDishRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /dishes/{owner}/{item_id}/recharacterize
            Method: POST
        EditDishRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /dishes/{owner}/{item_id}/edit
            Method: POST
      VpcConfig: !If
        - UseVpcCond
        - { SecurityGroupIds: [ !Ref LambdaSecurityGroupId ], SubnetIds: !Ref LambdaSubnetIds }
        - !Ref AWS::NoValue

  AnalyzeDiscardOnUpload:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: analyze_discard_on_upload_nodejs/
      Handler: app.handler
      Runtime: nodejs20.x
      Timeout: 300
      MemorySize: 2048
      ReservedConcurrentExecutions: !Ref AnalyzeDiscardReservedConcurrency
      Environment:
        Variables:
          BUCKET_NAME: !Ref DiscardsBucketName
          PRODUCT_IMAGES_BUCKET: !Ref UploadsBucketName
          DISCARD_DEFAULT_IMAGE_KEY: "product-images/static/default-discard-icon.png"
          DISCARD_DEFAULT_IMAGE_URL: !Sub "https://${UploadsBucketName}.s3.amazonaws.com/product-images/static/default-discard-icon.png"
          JOBS_TABLE: !Ref JobsTable
          KEY_PREFIX: images/
          IOT_ENDPOINT: !Ref IotDataEndpoint
          RESULT_TOPIC_TEMPLATE: "trepo/{user_id}/{device_id}/jobs/{job_id}/result"
          DB_HOST:  !Ref DBHost
          DB_PORT:  !Ref DBPort
          DB_USER:  !Ref DBUser
          DB_PASS:  !Ref DBPass
          DB_NAME:  !Ref DBName
          OPENAI_API_KEY: !Ref OpenAIApiKey
          SERPAPI_API_KEY: !Ref SerpApiKey
          OPENAI_FAST_MODEL: "gpt-4.1-mini"
          OPENAI_MODEL: "gpt-5.4-2026-03-05"
          OPENAI_IMAGE_VERIFY_MODEL: "gpt-5.4-2026-03-05"
          QUICK_GLANCE_TIMEOUT_MS: 8000
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - !If
          - HasResults
          - { DynamoDBCrudPolicy: { TableName: !Ref ResultsTable } }
          - !Ref AWS::NoValue
        - Statement:
            Effect: Allow
            Action: iot:Publish
            Resource: "*"
        - Statement:
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${DiscardsBucketName}/images/*"
        - Statement:
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::${DiscardsBucketName}/resized-images/*"
        - Statement:
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::${DiscardsBucketName}/discard-images/*"
        - Statement:
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/discard-images/*"
        - Statement:
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/product-images/*"
        - Statement:
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt KitchenAnalysisGeneratorFunction.Arn
        - !If
          - UseVpcCond
          - AWSLambdaVPCAccessExecutionRole
          - !Ref AWS::NoValue
      Events:
        S3CreateViaEB:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [aws.s3]
              detail-type: ["Object Created"]
              detail:
                bucket:
                  name: [!Ref DiscardsBucketName]
                object:
                  key:
                    - prefix: images/
      VpcConfig: !If
        - UseVpcCond
        - { SecurityGroupIds: [ !Ref LambdaSecurityGroupId ], SubnetIds: !Ref LambdaSubnetIds }
        - !Ref AWS::NoValue

  GetJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: get_job/
      Handler: app.handler
      ReservedConcurrentExecutions: !Ref LightApiReservedConcurrency
      Environment:
        Variables:
          BUCKET_NAME: !Ref UploadsBucketName
          DISCARDS_BUCKET_NAME: !Ref DiscardsBucketName
          JOBS_TABLE: !Ref JobsTable
          PRESIGN_TTL_SECONDS: 3600
          DB_HOST:  !Ref DBHost
          DB_PORT:  !Ref DBPort
          DB_USER:  !Ref DBUser
          DB_PASS:  !Ref DBPass
          DB_NAME:  !Ref DBName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref JobsTable
        - Statement:
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/*"
        - !If
          - UseVpcCond
          - AWSLambdaVPCAccessExecutionRole
          - !Ref AWS::NoValue
      Events:
        GetJobRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /job/{job_id}
            Method: GET
      VpcConfig: !If
        - UseVpcCond
        - { SecurityGroupIds: [ !Ref LambdaSecurityGroupId ], SubnetIds: !Ref LambdaSubnetIds }
        - !Ref AWS::NoValue

  ListTriageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: list_triage/
      Handler: app.handler
      ReservedConcurrentExecutions: !Ref LightApiReservedConcurrency
      Environment:
        Variables:
          DB_HOST:  !Ref DBHost
          DB_PORT:  !Ref DBPort
          DB_USER:  !Ref DBUser
          DB_PASS:  !Ref DBPass
          DB_NAME:  !Ref DBName
          JOBS_TABLE: !Ref JobsTable
          BUCKET_NAME: !Ref UploadsBucketName
          DISCARDS_BUCKET_NAME: !Ref DiscardsBucketName
          ACCEPTED_STALE_TIMEOUT_SECONDS: "600"
          TRIAGE_RECONCILE_BATCH_LIMIT: "100"
          TRIAGE_RECONCILE_TABLE_LIMIT: "250"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - Statement:
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/*"
        - Statement:
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${DiscardsBucketName}/*"
        - !If
          - UseVpcCond
          - AWSLambdaVPCAccessExecutionRole
          - !Ref AWS::NoValue
      Events:
        ListTriageRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /triage/{owner}
            Method: GET
        CancelTriageJobRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /triage/{owner}/{job_id}
            Method: DELETE
        AdminReconcileTriageRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /triage/admin/reconcile
            Method: POST
        ScheduledTriageReconcile:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Name: !Sub trepo-triage-reconcile-${Env}
            Description: Background reconciliation for stale triage rows
            Enabled: true
      VpcConfig: !If
        - UseVpcCond
        - { SecurityGroupIds: [ !Ref LambdaSecurityGroupId ], SubnetIds: !Ref LambdaSubnetIds }
        - !Ref AWS::NoValue

  DishResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dish_result/
      Handler: app.handler
      ReservedConcurrentExecutions: !Ref LightApiReservedConcurrency
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref JobsTable
        - !If
          - HasResults
          - { DynamoDBReadPolicy: { TableName: !Ref ResultsTable } }
          - !Ref AWS::NoValue
      Events:
        DishResultRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /dish/result
            Method: GET

  OtaScheduleApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ota_schedule_api/
      Handler: app.handler
      Timeout: 10
      MemorySize: 256
      ReservedConcurrentExecutions: !Ref LightApiReservedConcurrency
      Environment:
        Variables:
          OTA_SCHEDULES_TABLE: !Ref OtaSchedulesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OtaSchedulesTable
      Events:
        GetOtaScheduleRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ota/schedule
            Method: GET

  OtaScheduleAdminApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ota_schedule_admin_api/
      Handler: app.handler
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          OTA_SCHEDULES_TABLE: !Ref OtaSchedulesTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OtaSchedulesTable
      Events:
        GetOtaAdminScheduleRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ota/admin/schedule
            Method: GET
        PostOtaAdminScheduleRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ota/admin/schedule
            Method: POST
        PostOtaAdminScheduleClearRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ota/admin/schedule/clear
            Method: POST

  OtaReportApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ota_report_api/
      Handler: app.handler
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          OTA_REPORT_EVENTS_TABLE: !Ref OtaReportEventsTable
          OTA_DEVICE_LATEST_TABLE: !Ref OtaDeviceLatestTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OtaReportEventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OtaDeviceLatestTable
      Events:
        PostOtaReportRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ota/report
            Method: POST
        GetOtaReportLatestRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ota/report/latest
            Method: GET
        GetOtaReportEventsRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ota/report/events
            Method: GET

  KitchenApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: kitchen_api/
      Handler: app.handler
      Timeout: 60
      MemorySize: 512
      ReservedConcurrentExecutions: !Ref ApiHandlerReservedConcurrency
      Environment:
        Variables:
          DB_HOST:  !Ref DBHost
          DB_PORT:  !Ref DBPort
          DB_USER:  !Ref DBUser
          DB_PASS:  !Ref DBPass
          DB_NAME:  !Ref DBName
          MEAL_PLAN_GENERATOR_ARN: !Ref MealPlanGeneratorFunction
          RECIPES_GENERATOR_ARN: !Ref RecipesGeneratorFunction
          KITCHEN_ANALYSIS_GENERATOR_ARN: !Ref KitchenAnalysisGeneratorFunction
          OPENAI_API_KEY: !Ref OpenAIApiKey
          ENRICH_KITCHEN_ITEM_URL: https://6m9t6wosh9.execute-api.us-east-1.amazonaws.com/enrich-kitchen-item
      Policies:
        - !If
          - UseVpcCond
          - AWSLambdaVPCAccessExecutionRole
          - !Ref AWS::NoValue
        - Statement:
            Effect: Allow
