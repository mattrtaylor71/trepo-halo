        PersonalizeSavedRecipesRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /saved-recipes/{owner}/personalize
        GetSavedRecipeJobRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /saved-recipes/{owner}/jobs/{job_id}
            Method: GET
        PostSavedRecipesRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /saved-recipes/{owner}
            Method: POST
        DeleteSavedRecipeRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /saved-recipes/{owner}/{item_id}
            Method: DELETE
        UpdateSavedRecipeRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /saved-recipes/{owner}/{item_id}
            Method: PUT
        OptionsSavedRecipesRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /saved-recipes/{owner}
            Method: OPTIONS
        OptionsSavedRecipeItemRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /saved-recipes/{owner}/{item_id}
            Method: OPTIONS
        OptionsSavedRecipeJobRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /saved-recipes/{owner}/jobs/{job_id}
            Method: OPTIONS
        OptionsExtractCaptionRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /extract-caption
            Method: OPTIONS
        OptionsExtractContentRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /extract-content
            Method: OPTIONS
        OptionsRecipeFromCaptionRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /recipe-from-caption
            Method: OPTIONS
        OptionsRecipeFromContentRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /recipe-from-content
            Method: OPTIONS
        OptionsAnalyzeTikTokRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /analyze-tiktok
            Method: OPTIONS
        OptionsAnalyzeUrlRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /analyze-url
            Method: OPTIONS
      VpcConfig: !If
        - UseVpcCond
        - { SecurityGroupIds: [ !Ref LambdaSecurityGroupId ], SubnetIds: !Ref LambdaSubnetIds }
        - !Ref AWS::NoValue

  RecipesGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: recipes_generator/
      Handler: app.handler
      Runtime: python3.12
      Timeout: 420
      MemorySize: 1024
      ReservedConcurrentExecutions: !Ref RecipesGeneratorReservedConcurrency
      Environment:
        Variables:
          BUCKET_NAME: !Ref UploadsBucketName
          DB_HOST:  !Ref DBHost
          DB_PORT:  !Ref DBPort
          DB_USER:  !Ref DBUser
          DB_PASS:  !Ref DBPass
          DB_NAME:  !Ref DBName
          OPENAI_API_KEY: !Ref OpenAIApiKey
          OPENAI_MODEL: gpt-5.5
          # Substitution helper pinned to the prior model (unbenchmarked path,
          # keep-stable); main 20-recipe generation runs on gpt-5.5.
          OPENAI_SUBSTITUTION_MODEL: gpt-4.1-mini
          ENABLE_LLM_INVENTORY_MATCHING: !Ref EnableLlmInventoryMatching
          OPENAI_INVENTORY_MODEL: !Ref OpenAIInventoryModel
          OPENAI_INVENTORY_TIMEOUT_SECONDS: '8'
          RECIPES_GENERATE_IMAGES: "true"
          RECIPES_IMAGE_SLOT_COUNT: "3"
          RECIPES_IMAGE_MAX_WORKERS: "3"
          RECIPES_IMAGE_MIN_REMAINING_MS: "90000"
      Layers:
        - !Ref RecipeInventoryMatchingLayer
      Policies:
        - Statement:
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::${UploadsBucketName}/recipe-images/*"
        - Statement:
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: "*"
        - !If
          - UseVpcCond
          - AWSLambdaVPCAccessExecutionRole
          - !Ref AWS::NoValue
      VpcConfig: !If
        - UseVpcCond
        - { SecurityGroupIds: [ !Ref LambdaSecurityGroupId ], SubnetIds: !Ref LambdaSubnetIds }
        - !Ref AWS::NoValue

  RecipeInventoryMatchingLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-recipe-inventory-matching"
      ContentUri: recipe_inventory_layer/
      CompatibleRuntimes:
        - python3.9
        - python3.12

  ConsentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: consents_api/
      Handler: app.handler
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          CONSENT_EVENTS_TABLE: !Ref ConsentEventsTable
          CURRENT_CONSENTS_TABLE: !Ref CurrentUserConsentsTable
          SMS_SUPPRESSION_TABLE: !Ref SMSSuppressionTable
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:UpdateItem
              - dynamodb:Query
            Resource:
              - !GetAtt ConsentEventsTable.Arn
              - !Sub "${ConsentEventsTable.Arn}/index/*"
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:UpdateItem
            Resource: !GetAtt CurrentUserConsentsTable.Arn
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
            Resource: !GetAtt SMSSuppressionTable.Arn
      Events:
        AuthConsentRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/auth/consent
            Method: POST
        OptionsAuthConsentRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/auth/consent
            Method: OPTIONS
        RevokeConsentRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/consents/revoke
            Method: POST
        ConsentStatusRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/consents/status
            Method: POST
        ConsentHistoryRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/consents/history
            Method: POST
        OptionsRevokeConsentRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/consents/revoke
            Method: OPTIONS
        OptionsConsentStatusRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/consents/status
            Method: OPTIONS
        OptionsConsentHistoryRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/consents/history
            Method: OPTIONS

  SmsInboundFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: sms_inbound/
      Handler: app.handler
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          CONSENT_EVENTS_TABLE: !Ref ConsentEventsTable
          CURRENT_CONSENTS_TABLE: !Ref CurrentUserConsentsTable
          SMS_SUPPRESSION_TABLE: !Ref SMSSuppressionTable
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:UpdateItem
              - dynamodb:Query
            Resource:
              - !GetAtt ConsentEventsTable.Arn
              - !Sub "${ConsentEventsTable.Arn}/index/*"
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:UpdateItem
            Resource: !GetAtt CurrentUserConsentsTable.Arn
        - Statement:
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
            Resource: !GetAtt SMSSuppressionTable.Arn
      Events:
        SmsInboundRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/messaging/sms/inbound
            Method: POST

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "TrepoJobs-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: job_id, AttributeType: S }
        - { AttributeName: user_id, AttributeType: S }
        - { AttributeName: created_at, AttributeType: S }
      KeySchema:
        - { AttributeName: job_id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: owner-created-index
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ResultsTable:
    Condition: HasResults
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "TrepoResults-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: job_id, AttributeType: S }
      KeySchema:
        - { AttributeName: job_id, KeyType: HASH }

  OtaSchedulesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "TrepoOtaSchedules-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: device_id, AttributeType: S }
        - { AttributeName: request_id, AttributeType: S }
      KeySchema:
        - { AttributeName: device_id, KeyType: HASH }
        - { AttributeName: request_id, KeyType: RANGE }

  OtaReportEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "TrepoOtaReportEvents-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: device_id, AttributeType: S }
        - { AttributeName: event_ts_key, AttributeType: S }
        - { AttributeName: request_id, AttributeType: S }
        - { AttributeName: ts_epoch, AttributeType: N }
        - { AttributeName: report_type, AttributeType: S }
      KeySchema:
        - { AttributeName: device_id, KeyType: HASH }
        - { AttributeName: event_ts_key, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: RequestIdTsIndex
          KeySchema:
            - { AttributeName: request_id, KeyType: HASH }
            - { AttributeName: ts_epoch, KeyType: RANGE }
          Projection:
            ProjectionType: ALL
        - IndexName: ReportTypeTsIndex
          KeySchema:
            - { AttributeName: report_type, KeyType: HASH }
            - { AttributeName: ts_epoch, KeyType: RANGE }
          Projection:
            ProjectionType: ALL

  OtaDeviceLatestTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "TrepoOtaDeviceLatest-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: device_id, AttributeType: S }
        - { AttributeName: owner_id, AttributeType: S }
        - { AttributeName: last_seen_epoch, AttributeType: N }
      KeySchema:
        - { AttributeName: device_id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: OwnerLatestIndex
          KeySchema:
            - { AttributeName: owner_id, KeyType: HASH }
            - { AttributeName: last_seen_epoch, KeyType: RANGE }
          Projection:
            ProjectionType: ALL

  ConsentEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: trepo-consent-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: user_id, AttributeType: S }
        - { AttributeName: event_id, AttributeType: S }
        - { AttributeName: phone_number, AttributeType: S }
        - { AttributeName: email, AttributeType: S }
        - { AttributeName: occurred_at, AttributeType: S }
      KeySchema:
        - { AttributeName: user_id, KeyType: HASH }
        - { AttributeName: event_id, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: phone-index
          KeySchema:
            - { AttributeName: phone_number, KeyType: HASH }
            - { AttributeName: occurred_at, KeyType: RANGE }
          Projection:
            ProjectionType: ALL
        - IndexName: email-index
          KeySchema:
            - { AttributeName: email, KeyType: HASH }
            - { AttributeName: occurred_at, KeyType: RANGE }
          Projection:
            ProjectionType: ALL

  CurrentUserConsentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: trepo-current-user-consents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: user_id, AttributeType: S }
      KeySchema:
        - { AttributeName: user_id, KeyType: HASH }

  SMSSuppressionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: trepo-sms-suppression
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: phone_number, AttributeType: S }
      KeySchema:
        - { AttributeName: phone_number, KeyType: HASH }

Outputs:
  ApiUrl:
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"
  BucketName:
    Value: !Ref UploadsBucketName
  JobsTableName:
    Value: !Ref JobsTable
  ResultsTableName:
    Condition: HasResults
    Value: !Ref ResultsTable
  OtaSchedulesTableName:
    Value: !Ref OtaSchedulesTable
  OtaReportEventsTableName:
    Value: !Ref OtaReportEventsTable
  OtaDeviceLatestTableName:
    Value: !Ref OtaDeviceLatestTable
  ConsentEventsTableName:
    Value: !Ref ConsentEventsTable
  CurrentUserConsentsTableName:
    Value: !Ref CurrentUserConsentsTable
  SMSSuppressionTableName:
    Value: !Ref SMSSuppressionTable
