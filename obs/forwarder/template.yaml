AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  trepo-obs-forwarder — single-pane backend error forwarder. Receives CloudWatch
  Logs subscription events, extracts JSON error markers (evt=analysis_failed /
  backend_error) plus the free-text "Background processing error" marker, and
  writes them into the TrepoAnalyticsEvents DynamoDB table.

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: nodejs22.x

Resources:
  ErrorForwarderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: trepo-obs-error-forwarder
      Handler: index.handler
      CodeUri: src/
      Description: Forwards backend error log markers into TrepoAnalyticsEvents
      Environment:
        Variables:
          TABLE_NAME: TrepoAnalyticsEvents
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                - !Sub 'arn:aws:dynamodb:us-east-1:${AWS::AccountId}:table/TrepoAnalyticsEvents'

  # Allow CloudWatch Logs (in us-east-1, this account) to invoke the forwarder.
  LogsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ErrorForwarderFunction
      Action: lambda:InvokeFunction
      Principal: logs.us-east-1.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

Outputs:
  ForwarderFunctionArn:
    Description: ARN of the error forwarder function (destination for subscription filters)
    Value: !GetAtt ErrorForwarderFunction.Arn
  ForwarderFunctionName:
    Value: !Ref ErrorForwarderFunction
