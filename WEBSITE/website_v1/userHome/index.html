                style="position: relative; display: inline-block; width: 90%; max-width: 400px;"
              >

                <video
                  id="camera-stream"

                  playsinline
                  muted
                  style="width: 100%; border-radius: 12px;"
                ></video>

                  id="capture-button"
                  class="guide-btn1"

                    left: 50%;
                    transform: translateX(-50%);
                    padding: 10px 20px;
                    font-size: 16px;
                  "
                >

              <div
                id="snapshot-container"
                style="position: relative; margin-top: 20px; width: 90%; max-width: 400px; margin: 20px auto;"
              >
